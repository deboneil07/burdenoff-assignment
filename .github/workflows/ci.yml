name: burdenoff CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: backend CI
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: habit_tracker_test
        ports:
           - '5432:5432'
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/habit_tracker_test?schema=public"
      WT_SECRET: "ci_test_secret_key"
      PORT: 5000
    defaults:
      run:
        working-directory: ./server
    steps:
          - name: Checkout Code
            uses: actions/checkout@v4

          - name: Setup Node.js
            uses: actions/setup-node@v4
            with:
              node-version: 20
              cache: "npm"
              cache-dependency-path: server/package-lock.json

          - name: Install Dependencies
            run: npm ci

          - name: Generate Prisma Client & Push Schema
            run: |
              npx prisma generate
              npx prisma db push

          - name: Run Tests (Streak & Timezone Edge Cases)
            run: npm test
  frontend:
              name: Frontend CI
              runs-on: ubuntu-latest

              defaults:
                run:
                  working-directory: ./client

              steps:
                - name: Checkout Code
                  uses: actions/checkout@v4

                - name: Setup Node.js
                  uses: actions/setup-node@v4
                  with:
                    node-version: 20
                    cache: "npm"
                    cache-dependency-path: client/package-lock.json

                - name: Install Dependencies
                  run: npm ci

                - name: Run Frontend Tests (if present)
                  run: npm test --if-present

                - name: Verify Production Build
                  run: npm run build
